name: Deploy to Azure Static Web Apps

# Publishes src/ to the Static Web App swa-foundatrix-site (resource group rg-lateralpile)
# on every push to main. Pull requests are not deployed: a pull request from a fork cannot
# read the deployment token, so a preview job would only fail for outside contributors.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy src/
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src
          output_location: ""
          api_location: ""
          skip_app_build: true
