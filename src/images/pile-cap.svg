  <line x1="480.54" y1="367.4" x2="433.16" y2="329.85" stroke="#F0388F" stroke-width="4"/>
  <polygon points="424.16,334.85 439.16,332.85 433.16,322.85" fill="#F0388F"/>
  <g><rect x="237.14" y="613" width="68" height="22" rx="11" fill="#121726" stroke="rgba(148,163,184,0.35)"/><text x="271.14" y="628.5" font-size="11.5" fill="#e2e8f0" text-anchor="middle">P3 · 96 k</text></g>
  <g><rect x="301.57" y="650.2" width="68" height="22" rx="11" fill="#121726" stroke="rgba(148,163,184,0.35)"/><text x="335.57" y="665.7" font-size="11.5" fill="#e2e8f0" text-anchor="middle">P6 · 118 k</text></g>
  <g><rect x="494.86" y="613" width="68" height="22" rx="11" fill="#121726" stroke="rgba(148,163,184,0.35)"/><text x="528.86" y="628.5" font-size="11.5" fill="#e2e8f0" text-anchor="middle">P7 · 162 k</text></g>
  <g><rect x="430.43" y="650.2" width="68" height="22" rx="11" fill="#121726" stroke="rgba(148,163,184,0.35)"/><text x="464.43" y="665.7" font-size="11.5" fill="#e2e8f0" text-anchor="middle">P8 · 154 k</text></g>
  <g><rect x="366" y="687.4" width="68" height="22" rx="11" fill="#121726" stroke="rgba(148,163,184,0.35)"/><text x="400" y="702.9" font-size="11.5" fill="#e2e8f0" text-anchor="middle">P9 · 146 k</text></g>
