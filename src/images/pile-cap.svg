<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="Segoe UI, Segoe UI Variable Text, Arial, sans-serif">
  <title>A pile cap on nine piles, each pile coloured by its axial force over its resistance, with its force beside it</title>
