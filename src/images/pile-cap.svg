  <rect x="790" y="66" width="362" height="160" rx="20" fill="#f8fafc"/>
  <text x="818" y="102" font-size="12" font-weight="700" fill="#0f766e" letter-spacing="1.2">PILE FORCES · LEGEND</text>
  <text x="818" y="130" font-size="15" font-weight="700" fill="#0f172a">1.2D + 1.0W + L (strength)</text>
  <text x="818" y="152" font-size="12.5" fill="#64748b">Axial force over factored resistance</text>
  <rect x="818" y="168" width="306" height="14" rx="7" fill="url(#ramp)"/>
  <g font-size="11.5" fill="#64748b"><text x="818" y="200">0</text><text x="971" y="200" text-anchor="middle">0.5</text><text x="1124" y="200" text-anchor="end">1.0</text></g>

  <rect x="790" y="250" width="362" height="444" rx="20" fill="#121726" stroke="rgba(148,163,184,0.22)"/>
  <text x="818" y="286" font-size="12" font-weight="700" fill="#b8a9f6" letter-spacing="1.2">EACH PILE, ITS OWN PILEAXIS ANALYSIS</text>
  <g font-size="13.5" fill="#e2e8f0">
    <circle cx="826" cy="318" r="9" fill="#2f9e5a"/><polyline points="821.5,318 825,321.5 830.5,314.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="846" y="323">Axially, its own t-z and tip response</text>
    <circle cx="826" cy="354" r="9" fill="#2f9e5a"/><polyline points="821.5,354 825,357.5 830.5,350.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="846" y="359">Laterally, its own p-y curves</text>
    <circle cx="826" cy="390" r="9" fill="#2f9e5a"/><polyline points="821.5,390 825,393.5 830.5,386.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="846" y="395">The cap rigid, balanced on its piles</text>
    <circle cx="826" cy="426" r="9" fill="#2f9e5a"/><polyline points="821.5,426 825,429.5 830.5,422.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="846" y="431">in all six directions, every combination</text>
  </g>
  <line x1="818" y1="456" x2="1124" y2="456" stroke="rgba(148,163,184,0.18)"/>
  <text x="818" y="486" font-size="12" font-weight="700" fill="#b8a9f6" letter-spacing="1.2">CHECKED ON EVERY PILE</text>
  <g font-size="13.5" fill="#e2e8f0">
    <text x="818" y="516">Compression against its resistance</text>
    <text x="818" y="544">Uplift against its pull-out resistance</text>
    <text x="818" y="572">The soil beside it, at the worst depth</text>
    <text x="818" y="600">Its section: axial force with bending,</text>
    <text x="818" y="622">and shear, by PileAxis's own checks</text>
  </g>
  <text x="818" y="664" font-size="12" fill="#a3b0c4">Allowable resistances on service combinations,</text>
  <text x="818" y="682" font-size="12" fill="#a3b0c4">factored ones on strength combinations.</text>
</svg>